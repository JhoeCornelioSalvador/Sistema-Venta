<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión del Menú - El Gusto Marino</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../Dashboard/dashboard.css">
  <link rel="stylesheet" href="menu.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../js/auth-guard.js" data-role="administrador"></script>
</head>

<body>
  <div class="dashboard-layout">
    <!-- SIDEBAR -->
    <aside id="sidebar"></aside>
    <main class="main-content">
      <div class="contenido">
        <div class="formularios-container">
          <div class="formulario gestion-menu">
            <div class="module-card">
              <div class="titulo-menu">
                <h1>Gestión del <span>Menú</span></h1>
                <p class="subtitulo">Registra platillos, bebidas y postres</p>
              </div>

              <form id="formPlato" enctype="multipart/form-data">
                <input type="hidden" id="id" name="id">
                <div class="form-grupo">
                  <h3><i class="fas fa-utensils"></i> Detalles del Platillo</h3>

                  <div class="fila">
                    <div class="campo">
                      <label for="nombre">Nombre</label>
                      <input type="text" id="nombre" name="nombre" placeholder="Ej: Ceviche Mixto" required>
                    </div>
                    <div class="campo">
                      <label for="categoria">Categoría</label>
                      <select id="categoria" name="categoria" required>
                        <option value="">Seleccionar</option>
                        <option value="platillo">Platillo</option>
                        <option value="bebida">Bebida</option>
                        <option value="postre">Postre</option>
                      </select>
                    </div>
                  </div>

                  <div class="fila">
                    <div class="campo">
                      <label for="precio">Precio (S/)</label>
                      <input type="number" id="precio" name="precio" step="0.01" placeholder="0.00" required>
                    </div>
                    <div class="campo" style="grid-column: span 2;">
                      <label for="descripcion">Descripción</label>
                      <textarea id="descripcion" name="descripcion" placeholder="Describe el platillo..." required></textarea>
                    </div>
                  </div>
                </div>

                <!-- SECCIÓN DE INSUMOS -->
                <div class="seccion-insumos">
                  <h3><i class="fas fa-box-open"></i> Insumos Requeridos</h3>
                  
                  <div id="insumosContainer" class="contenedor-insumos"></div>
                  
                  <button type="button" id="btnAgregarInsumo" class="btn-agregar">
                    <i class="fas fa-plus"></i> Agregar Insumo
                  </button>
                </div>
                <div class="acciones-form">
                  <div class="upload-imagen">
                    <label for="imagen" class="label-imagen">
                      <i class="fas fa-image"></i> Seleccionar Imagen
                    </label>
                    <input type="file" id="imagen" name="imagen" accept="image/*">
                    <span id="nombre-archivo"></span>
                  </div>

                  <!-- Botones de acción -->
                  <div class="acciones">
                    <button type="submit" class="btn-agregar">
                      <i class="fas fa-save"></i> Guardar
                    </button>
                    <button type="button" id="btnCancelar" class="btn-cancelar" style="display:none;">
                      <i class="fas fa-times"></i> Cancelar
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>

          <!-- FORMULARIO CARTILLA MENÚ -->
          <div class="formulario cartilla-menu">
            <div class="module-card">
              <div class="titulo-menu">
                <h1>Cartilla <span>Menú</span></h1>
                <p class="subtitulo">Platillos disponibles</p>
              </div>
              
              <div id="tablaMenu-container" style="width: 100%; overflow-x: auto;">
                <table id="tablaMenu">
                  <thead>
                    <tr>
                      <th>Imagen</th>
                      <th>Nombre</th>
                      <th>Categoría</th>
                      <th>Precio</th>
                      <th style="min-width: 250px;">Descripción</th>
                      <th>Acciones</th>
                    </tr>
                  </thead>
                  <tbody id="tablaMenuBody">
                  </tbody>
                </table>
              </div>
            </div>
          </div>

  <script src="../Dashboard/loadSidebar.js"></script>
  <script>cargarSidebar("admin");</script>
  <script src="menu.js"></script>
</body>
</html>
