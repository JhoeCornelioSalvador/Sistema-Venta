<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inventario - El Gusto Marino</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../Dashboard/dashboard.css">
  <link rel="stylesheet" href="inventario.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="../js/auth-guard.js" data-role="administrador"></script>
</head>

<body>
  <div class="dashboard-layout">
    <aside id="sidebar"></aside>

    <main class="main-content">
      <div class="module-card">
        <div class="titulo-inventario">
          <h1>Control de <span>Inventario</span></h1>
          <p class="subtitulo">Administra tus insumos con precisión y estilo</p>
        </div>
        <form id="formInsumo">
          <input type="hidden" id="id" name="id">

          <div class="form-grupo">
            <h3><i class="fas fa-box-open"></i> Datos del Insumo</h3>

            <div class="fila">
              <div class="campo">
                <label for="nombre">Nombre del insumo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Filete de pescado" required>
              </div>
              <div class="campo">
                <label for="cantidad">Cantidad</label>
                <input type="number" id="cantidad" name="cantidad" placeholder="Ej: 50" required>
              </div>
              <div class="campo">
                <label for="unidad">Unidad de medida</label>
                <input type="text" id="unidad" name="unidad" placeholder="Ej: kg, L, unidades" required>
              </div>
            </div>

            <div class="fila">
              <div class="campo">
                <label for="categoria">Categoría</label>
                <select id="categoria" name="categoria" required>
                  <option value="">Seleccionar categoría</option>
                  <option value="Carnes">Carnes</option>
                  <option value="Frutas y Verduras">Frutas y Verduras</option>
                  <option value="Lácteos">Lácteos</option>
                  <option value="Secos y Deshidratados">Secos y Deshidratados</option>
                  <option value="Condimentos">Condimentos</option>
                  <option value="Bebidas">Bebidas</option>
                  <option value="Panadería y Repostería">Panadería y Repostería</option>
                  <option value="Enlatados">Enlatados</option>
                </select>
              </div>
            </div>

            <!-- Botones dentro del formulario -->
            <div class="acciones-form">
              <button type="submit" id="btnGuardar" class="btn-agregar">
                <i class="fas fa-save"></i> Guardar
              </button>
              <button type="button" id="btnCancelar" class="btn-cancelar" style="display:none;">
                <i class="fas fa-times"></i> Cancelar
              </button>
            </div>
          </div>
        </form>

        <!-- ===== FILTRO ===== -->
        <div class="filtro-categoria">
          <label for="filtroCategoria">
            <i class="fas fa-filter"></i> Filtrar por categoría
          </label>
          <select id="filtroCategoria">
            <option value="">Todas las categorías</option>
            <option value="Carnes">Carnes</option>
            <option value="Frutas y Verduras">Frutas y Verduras</option>
            <option value="Lácteos">Lácteos</option>
            <option value="Secos y Deshidratados">Secos y Deshidratados</option>
            <option value="Condimentos">Condimentos</option>
            <option value="Bebidas">Bebidas</option>
            <option value="Panadería y Repostería">Panadería y Repostería</option>
            <option value="Enlatados">Enlatados</option>
            
          </select>
          <p class="subtitulo-filtro">Selecciona una categoría para filtrar los insumos</p>
        </div>

        <!-- ===== TABLA ===== -->
        <div id="tablaInventario-container">
          <table id="tablaInventario">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Cantidad</th>
                <th>Unidad</th>
                <th>Categoría</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

      </div>
    </main>
  </div>

  <script src="../Dashboard/loadSidebar.js"></script>
  <script>cargarSidebar("admin");</script>
  <script src="inventario.js"></script>
</body>
</html>
